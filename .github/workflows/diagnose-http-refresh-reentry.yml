name: Native Swift #11 parallel refresh Binary follow-up

on:
  push:
    branches: [diagnostics/http-refresh-reentry-ar]

permissions:
  contents: read

concurrency:
  group: http-refresh-reentry-ar-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  qualify:
    name: Apple / exact parallel Binary and probe isolation
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 18
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: 2a8108bbe2692c349069d71b2f5eb2f9a501c171
          path: .tmp/s-product
          fetch-depth: 2
          persist-credentials: false

      - name: Replay the exact Binary leaf and isolate probe WMO
        run: bash .github/diagnostics/http-refresh-reentry/run.sh s-parallel-followup

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-http-refresh-reentry-s-parallel-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/refresh-reentry-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
