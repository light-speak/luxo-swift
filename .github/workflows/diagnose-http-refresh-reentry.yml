name: Attribute Swift #11 refresh and success-path allocations

on:
  push:
    branches: [diagnostics/http-refresh-reentry-scope]

permissions:
  contents: read

concurrency:
  group: http-refresh-reentry-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  qualify:
    name: Apple / matched refresh scope comparison
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: 2a8108bbe2692c349069d71b2f5eb2f9a501c171
          path: .tmp/s-product
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: d6578969bcef258141c7c99cb6cface30a22a0e2
          path: .tmp/a-product
          fetch-depth: 1
          persist-credentials: false

      - name: Trace the three refresh fixtures and the no-refresh JSON placements
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: bash .github/diagnostics/http-refresh-reentry/run-scope-attribution.sh

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-http-refresh-reentry-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/refresh-reentry-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
