name: Native HTTP successful JSON hot-alignment comparison

on:
  push:
    branches: [diagnostics/http-refresh-reentry-ar]

permissions:
  contents: read

concurrency:
  group: http-refresh-reentry-ar-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  qualify:
    name: Apple / successful JSON hot alignment
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 13
          persist-credentials: false

      - name: Verify exact Mach-O alignment and compare the successful JSON leaf
        run: bash .github/diagnostics/http-refresh-reentry/run.sh r-hot-alignment

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-http-refresh-reentry-ar-hot-alignment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/refresh-reentry-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
