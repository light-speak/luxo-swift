name: Native HTTP three-source cold refresh attribution

on:
  push:
    branches: [diagnostics/http-refresh-reentry-ar]

permissions:
  contents: read

concurrency:
  group: http-refresh-reentry-ar-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  qualify:
    name: Apple / cold refresh allocation attribution
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 14
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: 2a8108bbe2692c349069d71b2f5eb2f9a501c171
          path: .tmp/s-product
          fetch-depth: 2
          persist-credentials: false

      - name: Verify retired owner lifetime and trace the original cold refresh workload
        run: bash .github/diagnostics/http-refresh-reentry/run.sh r-s-cold-stacks

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-http-refresh-reentry-ars-cold-stacks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/refresh-reentry-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
