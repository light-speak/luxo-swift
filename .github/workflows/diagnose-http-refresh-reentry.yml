name: Native HTTP refresh follow-up measurements

on:
  push:
    branches: [diagnostics/http-refresh-reentry-ar]

permissions:
  contents: read

concurrency:
  group: http-refresh-reentry-ar-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  qualify:
    name: Apple / remaining runtime measurements
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 11
          persist-credentials: false

      - name: Check the remaining timing and allocation paths on the pinned SDK
        run: bash .github/diagnostics/http-refresh-reentry/run.sh r-residual

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-http-refresh-reentry-ar-residual-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/refresh-reentry-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
